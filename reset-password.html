
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TVA - Reset Password</title>

    <link rel="stylesheet" href="css/reset-password.css">
    <script type="module" src="js/reset-password.js"></script>
</head>

<body>

    <main class="form-container">

        <div class="lock-icon">🔐</div>

        <h1>Reset Password</h1>

        <p class="subtitle">
            Create a new password for your account.
        </p>

        <!-- Loading message -->
        <p id="status-message" role="status" aria-live="polite">
            Verifying your reset link...
        </p>

        <!-- Reset form -->
        <form id="reset-form" hidden>

            <!-- New password -->
            <div class="form-group">

                <label for="new-password">New Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="new-password"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="new-password"
                    >
                        Show
                    </button>

                </div>

            </div>

            <!-- Confirm password -->
            <div class="form-group">

                <label for="confirm-password">Confirm Password</label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirm-password"
                    >
                        Show
                    </button>

                </div>

            </div>

            <button class="btn" type="submit">
                Update Password
            </button>

        </form>

        <!-- Result message -->
        <p id="reset-message" role="status" aria-live="polite"></p>

        <p class="form-footer">
            Remembered your password?
            <a href="index.html">Back to Login</a>
        </p>

    </main>

</body>
</html>
